# XcodeGen spec — the source of truth for apple/FlyGACA.xcodeproj.
# The project is generated (never committed): `brew install xcodegen && npm run ios:generate`.
# All build settings live in the committed xcconfigs (Apps/Shared/App-Shared.xcconfig +
# per-app includes); CI-only settings (signing, build number) are passed on the
# xcodebuild command line, which outranks everything written into the project.
name: FlyGACA
options:
  createIntermediateGroups: true
  groupSortPosition: top
  # Current XcodeGen emits the Xcode 16 project format (objectVersion 77), which
  # Xcode 15 refuses with "future Xcode project file format" — open the generated
  # project with Xcode 16+ (CI uses macos-15 runners for this reason).
  xcodeVersion: "16.0"

packages:
  FlyGACAKit:
    path: FlyGACAKit

targetTemplates:
  FlyGACAApp:
    type: application
    platform: iOS
    configFiles:
      Debug: Apps/${target_name}/${target_name}.xcconfig
      Release: Apps/${target_name}/${target_name}.xcconfig
    # App Store manual signing. This MUST live here (not the xcconfigs, which
    # XcodeGen's generated target settings override; not the xcodebuild command
    # line, which leaks onto the FlyGACAKit_FeatureUI package resource bundle —
    # a target that rejects provisioning profiles). Scoped to the device SDK so
    # simulator/dev builds are untouched; unsigned CI archives still pass
    # CODE_SIGNING_ALLOWED=NO on the command line, which outranks all of this.
    settings:
      base:
        CODE_SIGN_STYLE[sdk=iphoneos*]: Manual
        DEVELOPMENT_TEAM[sdk=iphoneos*]: 76U6H3M3N6
        CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: FlyGACA ${target_name} AppStore
    sources:
      - path: Apps/Shared/FlyGACAApp.swift
      - path: Apps/${target_name}/Assets.xcassets
      # Blue folder reference: ContentLoader.bundledContentDirectory expects a real
      # Content/ directory in the bundle root (bundle.url(forResource: "Content")).
      - path: Apps/${target_name}/Content
        type: folder
        buildPhase: resources
    dependencies:
      - package: FlyGACAKit
        product: FeatureUI
      # The app shell (FlyGACAApp.swift) opens the SwiftData store and constructs
      # StudyStore directly, so it imports PersistenceKit explicitly rather than
      # relying on it being a transitive dependency of FeatureUI.
      - package: FlyGACAKit
        product: PersistenceKit
    scheme:
      testTargets: [AppleTests]
      gatherCoverageData: false

targets:
  # The unified flagship app with all features (PPL, CPL, IR, ATPL, ELPT, AIP, Flight Deck Tools, Captain Adel AI, Regulations)
  FlyGACA:
    templates: [FlyGACAApp]

  # Standalone modules for individual store listings / TestFlight
  ELPT:
    templates: [FlyGACAApp]
  AIP:
    templates: [FlyGACAApp]

  AppleTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AppleTests
    dependencies:
      - target: FlyGACA

