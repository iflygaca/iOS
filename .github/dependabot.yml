version: 2
updates:
  # Keep GitHub Actions pinned SHAs current across every workflow in this repo
  # (inherited from apps/flygaca-ios's dependabot.yml — a single root config
  # now covers both apps since GitHub Actions workflows only run from the
  # repo-root .github/workflows/).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # apps/captain-adel-ios's Fastlane/Ruby toolchain (Gemfile).
  - package-ecosystem: "bundler"
    directory: "/apps/captain-adel-ios"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
